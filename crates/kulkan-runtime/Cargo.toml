[package]
name = "kulkan-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gstreamer = "0.24.4"
kulkan-ipc = { path = "../kulkan-ipc" }
kulkan-library = { path = "../kulkan-library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kulkan-server"
path = "src/bin/kulkan-server.rs"

[[bin]]
name = "kulkan-stalled-server"
path = "src/bin/kulkan-stalled-server.rs"
