[workspace]
members = [".", "crates/kulkan-ipc", "crates/kulkan-library", "crates/kulkan-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[package]
name = "kulkan"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
kulkan-library = { path = "crates/kulkan-library" }
kulkan-runtime = { path = "crates/kulkan-runtime" }
libc = "0.2"

[[bin]]
name = "kulkan"
path = "src/main.rs"
