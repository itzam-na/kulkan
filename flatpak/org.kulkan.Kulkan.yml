app-id: org.kulkan.Kulkan
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kulkan
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: kulkan
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/kulkan/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --locked
      - cargo build --offline --release --locked -p kulkan --bin kulkan -p kulkan-runtime --bin kulkan-server
      - install -Dm0755 target/release/kulkan /app/bin/kulkan
      - install -Dm0755 target/release/kulkan-server /app/bin/kulkan-server
      - install -Dm0644 flatpak/org.kulkan.Kulkan.desktop /app/share/applications/org.kulkan.Kulkan.desktop
      - install -Dm0644 data/icons/512x512/apps/org.kulkan.Kulkan.png /app/share/icons/hicolor/512x512/apps/org.kulkan.Kulkan.png
    sources:
      - cargo-sources.json
      - type: dir
        path: ..
